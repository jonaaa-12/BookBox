services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-bookbox
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookbox_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgre
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 